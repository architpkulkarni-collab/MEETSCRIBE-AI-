      function confirmMeetingSetup() {
          const count = parseInt(document.getElementById('meetingSpeakerCount').value);
          const names = [];
          for (let i = 1; i <= count; i++) {
              const inp = document.getElementById(`speakerName${i}`);
              names.push(inp && inp.value.trim() ? inp.value.trim() : `Speaker ${i}`);
